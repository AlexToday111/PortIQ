spring:
  application:
    name: tradelab-portfolio
  main:
    banner-mode: off
  datasource:
    hikari:
      pool-name: tradelab-db
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 5000
      connection-init-sql: SET TIME ZONE 'UTC'
      data-source-properties:
        connectTimeout: 10
        socketTimeout: 30
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

tradelab:
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    owner-id: ${TELEGRAM_OWNER_ID:}
  database:
    host: ${DB_HOST:}
    port: ${DB_PORT:5432}
    name: ${DB_NAME:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    ru.ba6kir.tradelab: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF
    # SDK exceptions may contain token-bearing URLs; the adapter logs safe events instead.
    org.telegram: OFF
