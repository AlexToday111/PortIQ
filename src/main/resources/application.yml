spring:
  application:
    name: tradelab-portfolio
  main:
    banner-mode: off
  datasource:
    hikari:
      pool-name: tradelab-db
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 5000
      connection-init-sql: SET TIME ZONE 'UTC'
      data-source-properties:
        connectTimeout: 10
        socketTimeout: 30
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

tradelab:
  portfolio:
    broker-sync-enabled: ${PORTFOLIO_BROKER_SYNC_ENABLED:false}
    sync-cooldown: ${PORTFOLIO_SYNC_COOLDOWN:60s}
    max-pages: ${PORTFOLIO_SYNC_MAX_PAGES:20}
    quote-max-age: ${PORTFOLIO_QUOTE_MAX_AGE:3d}
  ranking:
    policy-version: ${RANKING_POLICY_VERSION:profile-period-1}
    snapshot-ttl: ${RANKING_SNAPSHOT_TTL:1h}
    refresh-cooldown: ${RANKING_REFRESH_COOLDOWN:60s}
    score-max-age: ${RANKING_SCORE_MAX_AGE:24h}
    quote-max-age: ${RANKING_QUOTE_MAX_AGE:3d}
    metadata-max-age: ${RANKING_METADATA_MAX_AGE:24h}
    instrument-uids: ${RANKING_INSTRUMENT_UIDS:}
  scoring:
    model-version: ${SCORING_MODEL_VERSION:fundamental-heuristic-1}
    configuration-version: ${SCORING_CONFIGURATION_VERSION:initial-1}
    weights:
      Q: ${SCORING_WEIGHT_Q:0.35}
      F: ${SCORING_WEIGHT_F:0.25}
      V: ${SCORING_WEIGHT_V:0.25}
      D: ${SCORING_WEIGHT_D:0.15}
    mandatory-pillars: ${SCORING_MANDATORY_PILLARS:Q,F,V,D}
    observation-max-age: ${SCORING_OBSERVATION_MAX_AGE:24h}
    financial-period-max-age: ${SCORING_FINANCIAL_PERIOD_MAX_AGE:548d}
    minimum-dividend-days: ${SCORING_MINIMUM_DIVIDEND_DAYS:1095}
    minimum-dividend-years: ${SCORING_MINIMUM_DIVIDEND_YEARS:3}
    extreme-yield: ${SCORING_EXTREME_YIELD:20}
    high-leverage: ${SCORING_HIGH_LEVERAGE:6}
    profiles: []
  analysis:
    minimum-peers: ${ANALYSIS_MINIMUM_PEERS:5}
    classification-max-age: ${ANALYSIS_CLASSIFICATION_MAX_AGE:365d}
    classifications: []
    profiles: []
  dividends:
    lookback-years: ${DIVIDENDS_LOOKBACK_YEARS:3}
    forward-days: ${DIVIDENDS_FORWARD_DAYS:365}
    cache-ttl: ${DIVIDENDS_CACHE_TTL:24h}
    refresh-cooldown: ${DIVIDENDS_REFRESH_COOLDOWN:60s}
  fundamentals:
    snapshot-ttl: ${FUNDAMENTALS_SNAPSHOT_TTL:24h}
    reporting-max-age: ${FUNDAMENTALS_REPORTING_MAX_AGE:548d}
    refresh-cooldown: ${FUNDAMENTALS_REFRESH_COOLDOWN:60s}
    report-window-days: ${FUNDAMENTALS_REPORT_WINDOW_DAYS:180}
  market-data:
    tracked-tickers: ${INVEST_TRACKED_TICKERS:}
    history-days: ${INVEST_HISTORY_DAYS:365}
    refresh-cooldown: ${INVEST_REFRESH_COOLDOWN:60s}
  invest:
    enabled: ${INVEST_API_ENABLED:false}
    token: ${INVEST_API_TOKEN:}
    metadata-ttl: ${INVEST_METADATA_TTL:24h}
    timeout: ${INVEST_API_TIMEOUT:3s}
    max-attempts: ${INVEST_API_MAX_ATTEMPTS:3}
    retry-backoff: ${INVEST_API_RETRY_BACKOFF:200ms}
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    owner-id: ${TELEGRAM_OWNER_ID:}
  database:
    host: ${DB_HOST:}
    port: ${DB_PORT:5432}
    name: ${DB_NAME:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    ru.ba6kir.tradelab: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF
    # SDK exceptions may contain token-bearing URLs; the adapter logs safe events instead.
    org.telegram: OFF
    # Provider transport messages/headers are never application diagnostics.
    ru.ttech.piapi: OFF
    io.grpc: OFF
