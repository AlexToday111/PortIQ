name: tradelab

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-tradelab}
      POSTGRES_USER: ${DB_USERNAME:-tradelab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or your environment}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  app:
    profiles: [app]
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tradelab}
      DB_USERNAME: ${DB_USERNAME:-tradelab}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or your environment}
      TZ: UTC
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-}
      INVEST_API_ENABLED: ${INVEST_API_ENABLED:-false}
      INVEST_API_TOKEN: ${INVEST_API_TOKEN:-}
      INVEST_METADATA_TTL: ${INVEST_METADATA_TTL:-24h}
      INVEST_API_TIMEOUT: ${INVEST_API_TIMEOUT:-3s}
      INVEST_API_MAX_ATTEMPTS: ${INVEST_API_MAX_ATTEMPTS:-3}
      INVEST_API_RETRY_BACKOFF: ${INVEST_API_RETRY_BACKOFF:-200ms}
      INVEST_TRACKED_TICKERS: ${INVEST_TRACKED_TICKERS:-}
      INVEST_HISTORY_DAYS: ${INVEST_HISTORY_DAYS:-365}
      INVEST_REFRESH_COOLDOWN: ${INVEST_REFRESH_COOLDOWN:-60s}
      FUNDAMENTALS_SNAPSHOT_TTL: ${FUNDAMENTALS_SNAPSHOT_TTL:-24h}
      FUNDAMENTALS_REPORTING_MAX_AGE: ${FUNDAMENTALS_REPORTING_MAX_AGE:-548d}
      FUNDAMENTALS_REFRESH_COOLDOWN: ${FUNDAMENTALS_REFRESH_COOLDOWN:-60s}
      FUNDAMENTALS_REPORT_WINDOW_DAYS: ${FUNDAMENTALS_REPORT_WINDOW_DAYS:-180}
      DIVIDENDS_LOOKBACK_YEARS: ${DIVIDENDS_LOOKBACK_YEARS:-3}
      DIVIDENDS_FORWARD_DAYS: ${DIVIDENDS_FORWARD_DAYS:-365}
      DIVIDENDS_CACHE_TTL: ${DIVIDENDS_CACHE_TTL:-24h}
      DIVIDENDS_REFRESH_COOLDOWN: ${DIVIDENDS_REFRESH_COOLDOWN:-60s}
      ANALYSIS_MINIMUM_PEERS: ${ANALYSIS_MINIMUM_PEERS:-5}
      ANALYSIS_CLASSIFICATION_MAX_AGE: ${ANALYSIS_CLASSIFICATION_MAX_AGE:-365d}
      RANKING_INSTRUMENT_UIDS: ${RANKING_INSTRUMENT_UIDS:-}
      RANKING_POLICY_VERSION: ${RANKING_POLICY_VERSION:-profile-period-1}
      RANKING_SNAPSHOT_TTL: ${RANKING_SNAPSHOT_TTL:-1h}
      RANKING_REFRESH_COOLDOWN: ${RANKING_REFRESH_COOLDOWN:-60s}
      RANKING_SCORE_MAX_AGE: ${RANKING_SCORE_MAX_AGE:-24h}
      RANKING_QUOTE_MAX_AGE: ${RANKING_QUOTE_MAX_AGE:-3d}
      RANKING_METADATA_MAX_AGE: ${RANKING_METADATA_MAX_AGE:-24h}
      PORTFOLIO_BROKER_SYNC_ENABLED: ${PORTFOLIO_BROKER_SYNC_ENABLED:-false}
      PORTFOLIO_SYNC_COOLDOWN: ${PORTFOLIO_SYNC_COOLDOWN:-60s}
      PORTFOLIO_SYNC_MAX_PAGES: ${PORTFOLIO_SYNC_MAX_PAGES:-20}
      PORTFOLIO_QUOTE_MAX_AGE: ${PORTFOLIO_QUOTE_MAX_AGE:-3d}
      SCORING_MODEL_VERSION: ${SCORING_MODEL_VERSION:-fundamental-heuristic-1}
      SCORING_CONFIGURATION_VERSION: ${SCORING_CONFIGURATION_VERSION:-initial-1}
      SCORING_WEIGHT_Q: ${SCORING_WEIGHT_Q:-0.35}
      SCORING_WEIGHT_F: ${SCORING_WEIGHT_F:-0.25}
      SCORING_WEIGHT_V: ${SCORING_WEIGHT_V:-0.25}
      SCORING_WEIGHT_D: ${SCORING_WEIGHT_D:-0.15}
      SCORING_MANDATORY_PILLARS: ${SCORING_MANDATORY_PILLARS:-Q,F,V,D}
      SCORING_OBSERVATION_MAX_AGE: ${SCORING_OBSERVATION_MAX_AGE:-24h}
      SCORING_FINANCIAL_PERIOD_MAX_AGE: ${SCORING_FINANCIAL_PERIOD_MAX_AGE:-548d}
      SCORING_MINIMUM_DIVIDEND_DAYS: ${SCORING_MINIMUM_DIVIDEND_DAYS:-1095}
      SCORING_MINIMUM_DIVIDEND_YEARS: ${SCORING_MINIMUM_DIVIDEND_YEARS:-3}
      SCORING_EXTREME_YIELD: ${SCORING_EXTREME_YIELD:-20}
      SCORING_HIGH_LEVERAGE: ${SCORING_HIGH_LEVERAGE:-6}
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 40s

volumes:
  postgres-data:
